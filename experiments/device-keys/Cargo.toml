[package]
name = "petika-device-key-model"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

# No production dependency or exported public API.
[workspace]

[dependencies]
chacha20poly1305 = "0.10.1"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
getrandom = "0.2.16"
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "x25519"] }
rand_chacha = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sha3 = "0.11"
x-wing = { version = "0.1.1", features = ["getrandom", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
