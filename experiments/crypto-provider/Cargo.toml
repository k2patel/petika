[package]
name = "petika-crypto-provider-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"

# Deliberately isolated from application dependencies and release artifacts.
[workspace]

[features]
default = ["non-fips"]
non-fips = ["aws-lc-rs/non-fips"]
fips = ["aws-lc-rs/fips", "dep:aws-lc-fips-sys"]

[dependencies]
aws-lc-rs = { version = "=1.17.0", default-features = false, features = ["alloc", "prebuilt-nasm"] }

# Same generated bindings/module as aws-lc-rs, for diagnostic service indicators only.
aws-lc-fips-sys = { version = "=0.13.17", optional = true }
