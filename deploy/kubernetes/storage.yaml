apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petika-data
  namespace: petika
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petika-mirror
  namespace: petika
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
