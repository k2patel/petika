apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: petika
resources:
  - ../kubernetes
configMapGenerator:
  - name: petika-mirror-scripts
    files: [mirror.sh, askpass.sh]
  - name: petika-proxy
    files: [nginx.conf]
patches:
  - path: deployment.yaml
  - target:
      kind: Service
      name: petika
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports
        value:
          - name: https
            port: 443
            targetPort: 8443
images:
  - name: petika
    newName: git.k2patel.in/k2patel/petika
    newTag: REPLACE_WITH_COMMIT
