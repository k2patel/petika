apiVersion: apps/v1
kind: Deployment
metadata:
  name: petika
  namespace: petika
spec:
  template:
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: petika
          env:
            - name: PETIKA_SETUP_MODE
              value: auto
            - name: PETIKA_ADMIN_USERNAME
              value: admin
            - name: PETIKA_ADMIN_PASSWORD_FILE
              value: /run/secrets/admin-password
        - name: tls
          image: nginxinc/nginx-unprivileged@sha256:782bb89768cc87b7f95c18b95baa1af250e5d451f26794f59363540161147c01
          command: [nginx, '-c', /config/nginx.conf, '-g', 'daemon off;']
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
          volumeMounts:
            - {name: proxy, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: proxy-tmp, mountPath: /tmp}
        - name: mirror
          image: alpine/git@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
          command: [/bin/sh, /scripts/mirror.sh]
          env:
            - name: PETIKA_BACKUP_URL
              value: https://git.k2patel.in/k2patel/petika-vault-backup.git
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: mirror, mountPath: /mirror, readOnly: true}
            - {name: mirror-scripts, mountPath: /scripts, readOnly: true}
            - {name: backup-auth, mountPath: /backup-auth, readOnly: true}
            - {name: mirror-tmp, mountPath: /tmp}
      volumes:
        - name: proxy
          configMap: {name: petika-proxy}
        - name: tls
          secret: {secretName: petika-tls, defaultMode: 0440}
        - name: proxy-tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
        - name: mirror-scripts
          configMap: {name: petika-mirror-scripts, defaultMode: 0555}
        - name: backup-auth
          secret: {secretName: petika-backup-auth, defaultMode: 0440}
        - name: mirror-tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
