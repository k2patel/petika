apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petika-data
  annotations:
    volume.podman.io/uid: '65532'
    volume.podman.io/gid: '65532'
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petika-mirror
  annotations:
    volume.podman.io/uid: '65532'
    volume.podman.io/gid: '65532'
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: petika
spec:
  restartPolicy: Always
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
  containers:
    - name: api
      image: localhost/petika:dev
      imagePullPolicy: Never
      env:
        - name: PETIKA_LISTEN
          value: 0.0.0.0:8080
        - name: PETIKA_DATA_DIR
          value: /data
        - name: PETIKA_GIT_MIRROR
          value: /mirror
        # Loopback-only HTTP example; keep true behind HTTPS.
        - name: PETIKA_COOKIE_SECURE
          value: "false"
        - name: PETIKA_TOKEN_FILE
          value: /run/secrets/token
      ports:
        - containerPort: 8080
          hostPort: 8080
          hostIP: 127.0.0.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        limits:
          memory: 512Mi
          cpu: '1'
      volumeMounts:
        - name: data
          mountPath: /data
        - name: mirror
          mountPath: /mirror
        - name: token
          mountPath: /run/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: petika-data
    - name: mirror
      persistentVolumeClaim:
        claimName: petika-mirror
    - name: token
      secret:
        secretName: petika-auth
        defaultMode: 0444
    - name: tmp
      emptyDir:
        medium: Memory
