name: Build isolated recovery QA image
on:
  workflow_dispatch:
jobs:
  image:
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: true
          keep-state: false
      - uses: docker/login-action@v3
        with:
          registry: git.k2patel.in
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.CONTAINER_TOKEN }}
      - name: Publish opt-in QA tools; never deploy automatically
        uses: docker/build-push-action@v6
        with:
          context: .
          target: push-runtime
          build-args: |
            PETIKA_RELEASE=${{ gitea.sha }}
            PETIKA_EXPERIMENTAL_ENTRY_FORMAT=1
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.k2patel.in/k2patel/petika:buildcache
          tags: git.k2patel.in/k2patel/petika:${{ gitea.sha }}-recovery-qa
