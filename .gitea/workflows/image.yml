name: Build Petika image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  image:
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: true
          keep-state: false
      - uses: docker/login-action@v3
        with:
          registry: git.k2patel.in
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.CONTAINER_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: git.k2patel.in/k2patel/petika:${{ gitea.sha }}
