name: Build Petika image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - clients/web/**
      - scripts/server_backup.py
      - scripts/offsite_backup.py
      - scripts/user_backup.py
      - scripts/backup_recovery.py
      - scripts/backup_delta.py
      - scripts/git_sync.py
      - scripts/build_web.sh
      - scripts/check_licenses.py
      - scripts/third_party_notices.py
      - LICENSE
  workflow_dispatch:
jobs:
  image:
    runs-on: docker
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: true
          keep-state: false
      - uses: docker/login-action@v3
        with:
          registry: git.k2patel.in
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.CONTAINER_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: push-runtime
          build-args: PETIKA_RELEASE=${{ gitea.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.k2patel.in/k2patel/petika:buildcache
          cache-to: type=registry,ref=git.k2patel.in/k2patel/petika:buildcache,mode=max
          tags: git.k2patel.in/k2patel/petika:${{ gitea.sha }}
