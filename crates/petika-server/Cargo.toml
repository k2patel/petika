[package]
name = "petika-server"
default-run = "petika-server"
description = "Self-hosted Petika API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
experimental-entry-format = ["petika-core/experimental-entry-format"]

[dependencies]
chacha20poly1305.workspace = true
tempfile.workspace = true
sha2.workspace = true
petika-core.workspace = true
gix.workspace = true
tiny_http.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
zeroize.workspace = true
argon2.workspace = true
getrandom.workspace = true
url = "=2.5.8"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "petika-entry-recovery"
path = "src/bin/entry_recovery.rs"
required-features = ["experimental-entry-format"]
