[package]
name = "petika-desktop"
description = "Petika desktop integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
experimental-git-client = ["petika-core/experimental-device-keys", "dep:serde", "dep:serde_json", "dep:zeroize", "dep:getrandom", "dep:base64", "dep:ed25519-dalek", "dep:thiserror", "dep:ureq", "dep:url", "dep:tempfile", "dep:libc"]

[dependencies]
petika-core.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
chacha20poly1305.workspace = true
