name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validator
        run: python -m pip install -r scripts/requirements-contracts.txt
      - name: Validate proposed API contracts and schema fixtures
        run: python scripts/check_api_contracts.py

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Dependency licenses
        if: runner.os == 'Linux'
        run: python3 scripts/check_licenses.py

  container:
    name: Distroless runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t petika:test .
      - name: Exercise distroless API and mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/petika-test/data /tmp/petika-test/mirror
          openssl rand -hex 32 > /tmp/petika-test/token
          sudo chown -R 65532:65532 /tmp/petika-test
          sudo chmod 755 /tmp/petika-test
          sudo chmod 444 /tmp/petika-test/token
          printf 'synthetic test passphrase\nsynthetic test passphrase\n' |
            docker run --rm -i --entrypoint /usr/local/bin/petika \
              -v /tmp/petika-test:/test petika:test \
              --store /test/fixture.petika --passphrase-stdin init
          docker run --rm -d --name petika-test --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1:18080:8080 \
            -v /tmp/petika-test/token:/run/secrets/token:ro \
            -v /tmp/petika-test/data:/data -v /tmp/petika-test/mirror:/mirror petika:test
          trap 'docker stop petika-test' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/ > /tmp/petika-index.html
          curl --fail --silent http://127.0.0.1:18080/wasm/petika_web_bg.wasm > /tmp/petika-browser.wasm
          curl --fail --silent http://127.0.0.1:18080/brand-dark.png > /tmp/petika-brand-dark.png
          sudo python3 scripts/smoke_api.py http://127.0.0.1:18080 \
            /tmp/petika-test/token /tmp/petika-test/fixture.petika
          if docker run --rm --entrypoint /bin/sh petika:test -c true; then
            echo 'Unexpected shell in distroless runtime' >&2
            exit 1
          fi

      - name: Build and validate server push runtime
        run: |
          docker build --target push-runtime --build-arg PETIKA_RELEASE=${{ github.sha }} -t petika:push .
          docker run --rm --entrypoint restic petika:push version
          docker run --rm --entrypoint python3 petika:push -c "import sys; sys.path.insert(0, '/usr/share/petika/scripts'); import server_backup"

  web:
    name: Web UI and provisioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust browser toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.114 --locked
      - name: Build native and browser clients
        run: |
          cargo build --workspace --locked
          sh scripts/build_web.sh
      - name: OTP reference vectors
        run: node scripts/test_otp.mjs
      - name: Backup integrity and clean-directory recovery
        run: |
          python3 scripts/test_backup_recovery.py
          python3 scripts/test_kubernetes_recovery.py
          PETIKA_TEST_API=1 python3 scripts/test_offsite_backup.py
          python3 scripts/test_backup_recovery.py --drill
      - name: Encrypted off-site repository round trip
        run: |
          curl --fail --location https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 -o /tmp/restic.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  /tmp/restic.bz2" | sha256sum --check
          bunzip2 /tmp/restic.bz2
          chmod 700 /tmp/restic
          PETIKA_TEST_RESTIC=/tmp/restic python3 scripts/test_offsite_backup.py
          PETIKA_TEST_RESTIC=/tmp/restic python3 scripts/test_server_push.py
      - name: Provisioning
        run: python3 scripts/test_setup.py
      - name: Install browser test tools
        run: |
          python3 -m venv /tmp/petika-browser-tests
          /tmp/petika-browser-tests/bin/pip install playwright==1.60.0 -r scripts/requirements-contracts.txt
          /tmp/petika-browser-tests/bin/playwright install --with-deps chromium
      - name: Browser workflows and permissions
        run: /tmp/petika-browser-tests/bin/python scripts/test_web_ui.py
      - name: Backup Settings workflows
        run: /tmp/petika-browser-tests/bin/python scripts/test_backup_settings.py
      - name: HTTP demo without secure-context-only APIs
        run: /tmp/petika-browser-tests/bin/python scripts/test_http_demo.py
      - name: Configured public endpoint and login cookies
        run: /tmp/petika-browser-tests/bin/python scripts/test_endpoint.py
      - name: Actual delivery request and response schemas
        run: |
          PETIKA_CONTRACT_CAPTURE="$RUNNER_TEMP/delivery-contracts.json" cargo test -p petika-server --test delivery --locked
          /tmp/petika-browser-tests/bin/python scripts/check_api_contracts.py --runtime "$RUNNER_TEMP/delivery-contracts.json"
      - name: CLI and browser group delivery in both encryption modes
        run: /tmp/petika-browser-tests/bin/python scripts/test_group_delivery.py
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petika-web-ui
          path: output/
